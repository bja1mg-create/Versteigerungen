<div class="view-switch" role="tablist">
  <a href="/{{ '?' ~ query if query }}" class="{{ 'active' if ansicht == 'liste' }}">Liste</a>
  <a href="/karte{{ '?' ~ query if query }}" class="{{ 'active' if ansicht == 'karte' }}">Karte</a>
</div>

<form class="filter" method="get" action="{{ '/karte' if ansicht == 'karte' else '/' }}">
  <input type="search" name="q" value="{{ f.q }}" placeholder="Ort, PLZ, Aktenzeichen, Stichwort …" class="span-2">
  <select name="bundesland">
    <option value="">Alle Bundesländer</option>
    {% for b in BUNDESLAENDER %}<option {% if f.bundesland == b %}selected{% endif %}>{{ b }}</option>{% endfor %}
  </select>
  <details class="multi">
    <summary>
      {%- if not f.objektart %}Alle Objektarten
      {%- elif f.objektart|length == 1 %}{{ f.objektart[0] }}
      {%- else %}{{ f.objektart|length }} Objektarten{% endif -%}
    </summary>
    <div class="multi-list">
      {% for o in objektarten %}
      <label class="check"><input type="checkbox" name="objektart" value="{{ o }}" {% if o in f.objektart %}checked{% endif %}> {{ o }}</label>
      {% endfor %}
    </div>
  </details>
  <div class="range">
    <span>Schätzwert €</span>
    <input type="text" inputmode="numeric" name="preis_min" value="{{ f.preis_min }}" placeholder="von" aria-label="Schätzwert von">
    <input type="text" inputmode="numeric" name="preis_max" value="{{ f.preis_max }}" placeholder="bis" aria-label="Schätzwert bis">
  </div>
  <div class="range">
    <span>Geringstes Gebot €</span>
    <input type="text" inputmode="numeric" name="gebot_min" value="{{ f.gebot_min }}" placeholder="von" aria-label="Geringstes Gebot von">
    <input type="text" inputmode="numeric" name="gebot_max" value="{{ f.gebot_max }}" placeholder="bis" aria-label="Geringstes Gebot bis">
  </div>
  <input type="text" inputmode="numeric" name="flaeche_min" value="{{ f.flaeche_min }}" placeholder="Fläche ab m²">
  <select name="sort">
    <option value="termin" {% if f.sort == 'termin' %}selected{% endif %}>Nächster Termin zuerst</option>
    <option value="schaetzwert_auf" {% if f.sort == 'schaetzwert_auf' %}selected{% endif %}>Schätzwert aufsteigend</option>
    <option value="schaetzwert_ab" {% if f.sort == 'schaetzwert_ab' %}selected{% endif %}>Schätzwert absteigend</option>
    <option value="neu" {% if f.sort == 'neu' %}selected{% endif %}>Neu eingetragen</option>
  </select>
  <label class="check"><input type="checkbox" name="vergangene" value="1" {% if f.vergangene %}checked{% endif %}> vergangene Termine zeigen</label>
  <div class="actions"><button type="submit">Suchen</button> <a href="{{ '/karte' if ansicht == 'karte' else '/' }}">Zurücksetzen</a></div>
</form>
<script>
  // Objektart-Auswahl schließen, wenn außerhalb geklickt wird
  document.addEventListener("click", (e) => {
    document.querySelectorAll("details.multi[open]").forEach((d) => { if (!d.contains(e.target)) d.open = false; });
  });
</script>
